services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: thaliyola
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thaliyola}
      POSTGRES_DB: thaliyola
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thaliyola"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://thaliyola:${POSTGRES_PASSWORD:-thaliyola}@db:5432/thaliyola
      ASSET_DIR: /data/assets
      EMBEDDING_CACHE_DIR: /data/models
    volumes:
      - assets:/data/assets
      - models:/data/models
    depends_on:
      db:
        condition: service_healthy
    # Published on localhost only; outside traffic arrives through the tunnel.
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # Cloudflare Tunnel to the Access-protected hostname. Enable with: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - server
    profiles: ["tunnel"]
    restart: unless-stopped

volumes:
  pgdata:
  assets:
  models:
