name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cairn"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cairn:cairn@localhost:5432/cairn_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cairn/server typecheck
      - run: pnpm --filter @cairn/server build
      - run: pnpm --filter @cairn/web build
      - run: pnpm test
