# Reverse proxy for Thaliyola on port 80, for use behind Cloudflare (Tunnel or proxied DNS) or another
# TLS-terminating proxy. Thaliyola itself stays on 127.0.0.1:8080.
# Install: cp deploy/native/nginx-thaliyola.conf /etc/nginx/sites-available/thaliyola
#          ln -s ../sites-available/thaliyola /etc/nginx/sites-enabled/thaliyola && nginx -t && systemctl reload nginx
# Then set PUBLIC_URL=https://<your host> in /etc/thaliyola/thaliyola.env and restart thaliyola.

# The scheme the visitor used: Cloudflare/cloudflared send X-Forwarded-Proto: https.
map $http_x_forwarded_proto $thaliyola_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # The visitor's real address (for login throttling and logs), when requests come through
    # Cloudflare. Trust the header only from the local network, where the tunnel connector runs.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;

    # Uploads arrive base64-encoded in JSON (5 MB files become ~7 MB requests).
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $thaliyola_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Live updates (server-sent events): no buffering, long-lived.
    location = /api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $thaliyola_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Lockfile uploads for vulnerability matching (a tar.gz; the server caps them at 25 MB).
    location ~ ^/(deps/upload/|api/dependencies$) {
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $thaliyola_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Document imports (a zip of pages and images) are sent raw; the server caps them at IMPORT_MAX_BYTES.
    location = /api/import {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $thaliyola_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}
